server {
  listen 80;
  server_name _;

  auth_basic "Supabase Studio";
  auth_basic_user_file /etc/nginx/.htpasswd;

  # Resolver de Docker: resuelve "studio" en cada request, así arranca
  # aunque Studio todavía no esté listo o cambie de IP al recrearse.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $studio_upstream http://studio:3000;

  location / {
    proxy_pass $studio_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
