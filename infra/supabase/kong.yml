# Gateway mínimo Kong (declarativo, sin DB) para el deploy único en Coolify.
# Un solo dominio público (SUPABASE_URL):
#   <gateway>/auth/v1/* -> gotrue (auth:9999)
#   <gateway>/rest/v1/* -> postgrest (rest:3000)
#   <gateway>/*         -> Studio (studio:3000), protegido con Basic Auth
# Las rutas /auth/v1 y /rest/v1 son más específicas y ganan sobre la raíz.
_format_version: "1.1"

consumers:
  - username: admin
    basicauth_credentials:
      - username: admin
        password: ZQbUmTNFmayHZePHinyl

services:
  - name: auth
    url: http://auth:9999
    routes:
      - name: auth
        paths:
          - /auth/v1
        strip_path: true
    plugins:
      - name: cors

  - name: rest
    url: http://rest:3000
    routes:
      - name: rest
        paths:
          - /rest/v1
        strip_path: true
    plugins:
      - name: cors

  - name: studio
    url: http://studio:3000
    routes:
      - name: studio
        paths:
          - /
        strip_path: false
        plugins:
          - name: basic-auth
            config:
              hide_credentials: true

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        - HEAD
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - X-Auth-Token
        - apikey
        - Authorization
        - Prefer
        - Range
        - suffix
        - ms
      exposed_headers:
        - Content-Range
        - Range
      credentials: true
      max_age: 3600
