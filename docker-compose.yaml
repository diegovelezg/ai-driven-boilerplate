# Deploy único en Coolify: push al repo → redeploy → todo levanta junto.
# Servicios: db (postgres supabase) + auth + rest + meta + studio + gateway (kong)
#   + migrator (aplica supabase/migrations/*.sql una sola vez cada una)
#   + web (Next.js) + searxng.
# Dominios (se asignan en la UI de Coolify, no aquí):
#   app.tudominio.com    -> web:3000
#   api.tudominio.com    -> gateway:8000   (SUPABASE_URL pública)
#   studio.tudominio.com -> studio:3000    (con protección de acceso de Coolify)
# Ver docs/coolify.md para el paso a paso y Studio.

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 10s
      retries: 5
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:?API_EXTERNAL_URL requerido (https://api.tudominio.com)}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      GOTRUE_SITE_URL: ${SITE_URL:?SITE_URL requerido (https://app.tudominio.com)}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-true}
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"

  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    command: ["postgrest"]

  meta:
    image: supabase/postgres-meta:v0.100.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY:?PG_META_CRYPTO_KEY requerido (openssl rand -hex 32)}

  studio:
    image: supabase/studio:2026.10.12-sha-3699278
    restart: unless-stopped
    depends_on:
      meta:
        condition: service_started
      gateway:
        condition: service_started
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY:?PG_META_CRYPTO_KEY requerido}
      PGRST_DB_SCHEMAS: public,graphql_public
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION:-retain}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT:-retain-engine-ai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SUPABASE_URL: http://gateway:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:?SUPABASE_PUBLIC_URL requerido (= API_EXTERNAL_URL)}
      SUPABASE_ANON_KEY: ${ANON_KEY:?ANON_KEY requerido (ver infra/supabase/gen-keys.py)}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY requerido (o SUPABASE_SERVICE_ROLE_KEY)}}
      AUTH_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}

  gateway:
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_started
      rest:
        condition: service_started
    volumes:
      - ./infra/supabase/kong.yml:/etc/kong/kong.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "kong health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: "off"

  migrator:
    image: postgres:17-alpine
    # Contenedor one-shot: no determina la salud del deploy (doc oficial Coolify).
    exclude_from_hc: true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./infra/supabase/migrate.sh:/scripts/migrate.sh:ro
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: ${POSTGRES_DB:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
    command: ["sh", "/scripts/migrate.sh"]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL:?SUPABASE_PUBLIC_URL requerido}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY:?ANON_KEY requerido}
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
      gateway:
        condition: service_started
    environment:
      # Server-side (internas, red compose): más rápido y sin salir a internet.
      SUPABASE_URL: http://gateway:8000
      SUPABASE_ANON_KEY: ${ANON_KEY:?ANON_KEY requerido}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY requerido (o SUPABASE_SERVICE_ROLE_KEY)}}
      # Browser (inlined en build + fallback runtime): URL pública del gateway.
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL:?SUPABASE_PUBLIC_URL requerido}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY:?ANON_KEY requerido}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?SECRETS_ENCRYPTION_KEY requerido}
      SEARXNG_URL: http://searxng:8080
      CRAWLEE_STORAGE_DIR: /tmp/crawlee
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET_KEY:?SEARXNG_SECRET_KEY requerido}
      BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080/}

volumes:
  pgdata:
